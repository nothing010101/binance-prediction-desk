<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk BTC-5m — Monitor</title>
<style>
  :root{--bg:#0b0e14;--panel:#121726;--panel2:#0e1320;--line:#1f2740;--txt:#e7ecf5;--mut:#8a93a8;
  --green:#34d399;--red:#fb7185;--amber:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;--cyan:#22d3ee;--coin:#f7931a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,14,20,.9);backdrop-filter:blur(8px);z-index:5}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--mut);font-size:12px;margin-left:6px}
  .spacer{flex:1}
  .badge{font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:#0b0e14}
  .badge.live{color:var(--green);border-color:rgba(52,211,153,.4)} .badge.dry{color:var(--amber);border-color:rgba(251,191,36,.4)} .badge.bad{color:var(--red);border-color:rgba(251,113,133,.4)}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  main{max-width:1180px;margin:0 auto;padding:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

  /* phase strip — the 4 desks/agents */
  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  @media(max-width:720px){.phases{grid-template-columns:repeat(2,1fr)}}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden;transition:.3s}
  .phase .ix{font-size:10px;color:var(--mut);font-weight:700}
  .phase .nm{font-size:13px;font-weight:650;margin-top:2px}
  .phase .st{font-size:11px;margin-top:6px;font-weight:700}
  .phase .dt{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.4}
  .phase.ok{border-color:rgba(52,211,153,.5)} .phase.ok .st{color:var(--green)}
  .phase.cooldown,.phase.warn{border-color:rgba(251,191,36,.5)} .phase.cooldown .st,.phase.warn .st{color:var(--amber)}
  .phase.err{border-color:rgba(251,113,133,.5)} .phase.err .st{color:var(--red)}
  .phase.skip .st{color:var(--mut)}
  .phase.exec{border-color:rgba(96,165,250,.6)} .phase.exec .st{color:var(--blue)}
  .phase .bar{position:absolute;left:0;top:0;height:2px;width:0;background:var(--green);animation:grow 1.2s ease forwards}
  .phase.cooldown .bar{background:var(--amber)} .phase.err .bar{background:var(--red)} .phase.exec .bar{background:var(--blue)}
  @keyframes grow{from{width:0}to{width:100%}}
  .phase.live::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(52,211,153,.10),transparent 60%);animation:breathe 2.4s infinite}
  @keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}

  /* market */
  .outs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .out{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .out.up{border-color:rgba(52,211,153,.4)} .out.down{border-color:rgba(251,113,133,.4)}
  .out .side{font-weight:700} .out.up .side{color:var(--green)} .out.down .side{color:var(--red)}
  .out .row{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
  .out .row .k{color:var(--mut)}
  .row{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
  .row .k{color:var(--mut)} .row .v{font-variant-numeric:tabular-nums}
  .edge.pos{color:var(--green)} .edge.neg{color:var(--red)}

  /* pnl */
  .pnlbig{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .pnlbig.pos{color:var(--green)} .pnlbig.neg{color:var(--red)}
  .pnlsub{color:var(--mut);font-size:12px}
  .wl{display:flex;gap:14px;margin-top:8px}
  .wl .w{color:var(--green)} .wl .l{color:var(--red)} .wl span{font-variant-numeric:tabular-nums;font-weight:600}
  svg.curve{width:100%;height:180px;display:block;margin-top:8px}
  .hist{max-height:240px;overflow:auto;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  td,th{padding:5px 7px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase}
  tr.win td:last-child{color:var(--green)} tr.lose td:last-child{color:var(--red)}
  .err{border-left:3px solid var(--red);padding:7px 10px;background:rgba(251,113,133,.06);border-radius:6px;margin-bottom:7px;font-size:11.5px}
  .err.warn{border-color:var(--amber);background:rgba(251,191,36,.06)}
  .err .code{font-weight:700;color:var(--red)} .err.warn .code{color:var(--amber)} .err .where{color:var(--mut)} .err .diag{color:var(--txt);margin-top:3px}
  .muted{color:var(--mut)}
  .ticker{font-size:11px;color:var(--mut);text-align:center;margin-top:14px}
  .coin{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#111;background:linear-gradient(135deg,#f7931a,#ffb648)}
</style>
</head>
<body>
<header>
  <div class="pulse" id="hb"></div>
  <div class="coin">₿</div>
  <h1>Desk BTC-5m<span class="sub">Binance Web3 · Up/Down · 5 min</span></h1>
  <div class="spacer"></div>
  <div id="mode" class="badge dry">…</div>
  <div id="auth" class="badge">auth …</div>
  <div id="upd" class="ticker">—</div>
</header>
<main>
  <!-- 4 phase desks -->
  <div class="phases" id="phases"></div>

  <div class="grid">
    <!-- market -->
    <div class="card">
      <h3>Round live — analisa &amp; rencana</h3>
      <div id="mkt" class="muted">…</div>
    </div>
    <!-- pnl -->
    <div class="card">
      <h3>PnL realized (hasil)</h3>
      <div class="pnlbig" id="pnl">—</div>
      <div class="pnlsub" id="pnld">—</div>
      <div class="wl" id="wl"></div>
      <svg class="curve" id="curve" viewBox="0 0 600 180" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="grid" style="margin-top:12px">
    <div class="card">
      <h3>Diagnosis kesalahan / peringatan</h3>
      <div id="errs" class="muted">—</div>
    </div>
    <div class="card">
      <h3>Riwayat settled (hasil realized)</h3>
      <div class="hist"><table id="histTbl"><thead><tr><th>round</th><th>side</th><th>shares</th><th>cost</th><th>realized</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>

  <div class="ticker">memantau <span id="repo">…</span> · refresh 15 dtk · <span id="lastId">—</span></div>
</main>

<script>
const RAW="https://raw.githubusercontent.com/nothing010101/binance-prediction-desk/main";
const PHASES=["Settle","Analisa","Rencanakan","Memutuskan+Eksekusi"];
function fmt(n,d=4){if(n==null||n===undefined||isNaN(n))return"–";return Number(n).toFixed(d)}
function tte(ms){if(ms==null)return"–";if(ms<=0)return"selesai";const s=Math.round(ms/1000);return Math.floor(s/60)+"m"+(s%60).toString().padStart(2,"0")+"s"}
function cls(p){const s=(p.status||"").toUpperCase();if(s.startsWith("EXEC"))return"exec";if(s==="COOLDOWN")return"cooldown";if(s==="ERROR")return"err";if(s==="SKIP")return"skip";return"ok"}

// animated count
let cur=0,target=0;
function animPnl(){ if(Math.abs(target-cur)<0.001){cur=target;renderPnl();return}
  cur+=(target-cur)*0.18; renderPnl(); requestAnimationFrame(animPnl); }

function renderPnl(){
  const el=document.getElementById('pnl'); const v=cur;
  el.textContent=(v>=0?"$":"-$")+Math.abs(v).toFixed(4);
  el.className="pnlbig "+(v>=0?"pos":"neg");
}

function drawCurve(pts){
  const svg=document.getElementById('curve'); svg.innerHTML="";
  if(!pts||pts.length<1) return;
  const W=600,H=180,pad=8;
  const ys=pts.map(p=>Number(p.cumulative_usd)||0);
  let mn=Math.min(0,...ys), mx=Math.max(0,...ys); if(mx===mn){mx=mn+1}
  const X=i=>pad + i*(W-2*pad)/Math.max(1,pts.length-1);
  const Y=v=> H-pad - (v-mn)*(H-2*pad)/(mx-mn);
  // zero line
  if(mn<0&&mx>0){const zy=Y(0);const z=document.createElementNS("http://www.w3.org/2000/svg","line");z.setAttribute("x1",pad);z.setAttribute("x2",W-pad);z.setAttribute("y1",zy);z.setAttribute("y2",zy);z.setAttribute("stroke","#2a3350");z.setAttribute("stroke-dasharray","4 4");svg.appendChild(z)}
  // segments colored by delta
  let d=""; for(let i=0;i<pts.length;i++){const x=X(i),y=Y(ys[i]); d+=(i===0?"M":"L")+x+" "+y+" "}
  // area fill
  const area=document.createElementNS("http://www.w3.org/2000/svg","path");
  const last=ys[ys.length-1]>=0;
  area.setAttribute("d", d+`L ${X(pts.length-1)} ${H-pad} L ${X(0)} ${H-pad} Z`);
  area.setAttribute("fill", last?"rgba(52,211,153,.10)":"rgba(251,113,133,.10)"); svg.appendChild(area);
  // line segments
  for(let i=1;i<pts.length;i++){
    const seg=document.createElementNS("http://www.w3.org/2000/svg","line");
    seg.setAttribute("x1",X(i-1));seg.setAttribute("x2",X(i));seg.setAttribute("y1",Y(ys[i-1]));seg.setAttribute("y2",Y(ys[i]));
    seg.setAttribute("stroke",(ys[i]-ys[i-1])>=0?"#34d399":"#fb7185");seg.setAttribute("stroke-width",2);
    svg.appendChild(seg);
  }
  // points
  pts.forEach((p,i)=>{const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",X(i));c.setAttribute("cy",Y(ys[i]));c.setAttribute("r",i===pts.length-1?4:2);c.setAttribute("fill",(ys[i]-ys[i-1]||0)>=0?"#34d399":"#fb7185");svg.appendChild(c)});
}

function render(s){
  document.getElementById('repo').textContent="nothing010101/binance-prediction-desk";
  const mode=document.getElementById('mode'); mode.textContent=s.dry_run?"DRY":"LIVE"; mode.className="badge "+(s.dry_run?"dry":"live");
  const au=document.getElementById('auth'); au.textContent="auth: "+(s.auth||"?"); au.className="badge "+((s.auth==="CONNECTED"||s.auth==="LOGGED_IN")?"live":"bad");
  document.getElementById('upd').textContent="update "+(s.ts||"—").slice(11,19)+"Z";
  document.getElementById('lastId').textContent="run "+(s.run_id||"—");

  // phases
  const phs=s.phases||[];
  document.getElementById('phases').innerHTML=PHASES.map((nm,i)=>{
    const p=phs[i]||{name:nm,status:"—",detail:""};
    const c=cls(p); const last=i===phs.length-1;
    return `<div class="phase ${c} ${last?'live':''}"><div class="bar"></div>
      <div class="ix">FASE ${i+1}</div><div class="nm">${nm}</div>
      <div class="st">${p.status||"—"}</div><div class="dt">${(p.detail||"").slice(0,120)}</div></div>`;
  }).join("");

  // market
  const m=s.market;
  const mk=document.getElementById('mkt');
  if(!m){mk.innerHTML='<span class="muted">round tidak ditemukan (lihat diagnosis)</span>';}
  else{
    const b=m.best||{}; const ec=(b.edge_net||0)>=0?"pos":"neg";
    let outs='<div class="outs">';
    for(const o of (m.outcomes||[])){
      const up=o.name==="Up";
      outs+=`<div class="out ${up?"up":"down"}"><div class="side">${o.name}</div>
        <div class="row"><span class="k">price</span><span>${fmt(o.price,3)}</span></div>
        <div class="row"><span class="k">chance</span><span>${fmt(o.chance,3)}</span></div></div>`;
    }
    outs+='</div>';
    mk.innerHTML=`<div class="row"><span class="k">topic</span><span class="v">${m.marketTopicId}</span></div>
      <div class="row"><span class="k">status</span><span class="v">${m.liveStatus||m.status}</span></div>
      <div class="row"><span class="k">likuiditas</span><span class="v">$${Math.round(m.liquidity||0).toLocaleString()}</span></div>
      <div class="row"><span class="k">menuju settle</span><span class="v">${tte(m.tte_ms)}</span></div>
      <div class="row"><span class="k">best side</span><span class="v ${b.side==="Up"?"":""}" style="color:${b.side==="Up"?"var(--green)":"var(--red)"}">${b.side||"—"}</span></div>
      <div class="row"><span class="k">edge (net)</span><span class="v edge ${ec}">${fmt(b.edge_net,4)}</span></div>
      ${outs}`;
  }

  // pnl
  const p=s.pnl||{cumulative_usd:0,wins:0,losses:0};
  target=Number(p.cumulative_usd||0); animPnl();
  document.getElementById('pnld').textContent="realized · dari posisi settled BTC-5m";
  document.getElementById('wl').innerHTML=`<div class="w">WINS <span>${p.wins||0}</span></div><div class="l">LOSSES <span>${p.losses||0}</span></div>`;

  // errors
  const errs=(s.errors||[]).filter(e=>e.code!=="REALIZED_LOSS");
  document.getElementById('errs').innerHTML=errs.length?errs.map(e=>`<div class="err ${e.code==='COOLDOWN'?'warn':''}"><span class="code">${e.code||"?"}</span> <span class="where">@${e.where||"?"}</span><div class="diag">${e.diag||""}</div></div>`).join(""):'<span class="muted">tidak ada kesalahan aktif</span>';

  // history (recent settled, newest first)
  const ns=(p.new||[]).slice().reverse();
  document.querySelector('#histTbl tbody').innerHTML = ns.length? ns.map(x=>`<tr class="${x.win?"win":"lose"}"><td>${(x.title||"").split("-").slice(-1)[0]||""}</td><td>${x.outcome||""}</td><td>${fmt(x.shares,2)}</td><td>$${fmt(x.cost,2)}</td><td>${x.realized>=0?"+":"-"}$${Math.abs(x.realized).toFixed(4)}</td></tr>`).join("") : '<tr><td colspan=5 class="muted">—</td></tr>';
}

let pnlHist=[];
async function loadPnl(){
  try{const r=await fetch(RAW+"/pnl_history.json?ts="+Date.now()); if(r.ok) pnlHist=await r.json(); drawCurve(pnlHist);}
  catch(e){}
}
async function tick(){
  try{
    const r=await fetch(RAW+"/state.json?ts="+Date.now());
    if(!r.ok) throw new Error("state.json ("+r.status+")");
    const s=await r.json(); render(s);
    document.getElementById('hb').style.background="var(--green)";
  }catch(e){document.getElementById('hb').style.background="var(--red)";document.getElementById('upd').textContent="gagal: "+e.message;}
}
tick(); loadPnl();
setInterval(tick,15000); setInterval(loadPnl,45000);
</script>
</body>
</html>
